# wrangler.toml
# ARLing Asistent worker: RAG chat API + tenant onboarding + daily feed cron.
# See ../README.md for the one-time setup commands (wrangler login, d1 create,
# vectorize create) that fill in the placeholder ids below.

name = "arling-asistent"
main = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Invocation logs (Request, Response a metadáta každej požiadavky, teda aj
# Referer stránky návštevníka a IP) vypnuté: zásady Asistenta sľubujú, že o
# návštevníkoch nič neukladáme. Ostávajú len naše console.warn/error (bez
# e-mailov a obsahu rozhovorov). Voľba podľa
# https://developers.cloudflare.com/workers/observability/logs/workers-logs/
# („invocation_logs = false“), uchovanie logov 3 dni Free, 7 dní Paid.
[observability.logs]
enabled = true
invocation_logs = false

# Comma-separated list of hostnames allowed to call the API without a known
# tenant match yet (the demo page, and any admin UI). Tenant domains are
# always allowed automatically once created (see src/security.js).
[vars]
ALLOWED_ORIGINS = "arling.sk"
# Stripe zakaznicky portal (sprava karty, zrusenie predplatneho), verejny
# odkaz, nie tajomstvo. Vraciaj sa nezmeneny v GET /v1/ucet/ja (src/ucet.js).
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/3cIaER9M63hNeFcg8B4ko00"
# Denny strop na Workers AI v neuronoch (viac v src/budget.js).
# 9500 je zamerne pod bezplatnou dennou davkou 10 000, takze kym to nezvysime,
# nad ramec pausalu 5 USD nezaplatime nic. Pri prvom platiacom zakaznikovi
# zvysit a zapisat zmenu do company/finances.md.
AI_DAILY_NEURON_BUDGET = "9500"
# Zivotny cyklus Asistenta (src/zivotny-cyklus.js, navrh
# ops/asistent/zivotny-cyklus.md). Vsetky tri su zamerne vypnute: deploy sam
# nic neposle. Udalosti v D1 sa zapisuju vzdy. Zapnut hodnotou "zapnute" az
# podla README "Zivotny cyklus", krok po kroku.
#   ASISTENT_EMAILY: e-maily majitelom obchodov cez Resend (E0 az E4).
#     Zapnut az po novej casti zasad sukromia a zapise v ops/ai/rozhodnutia.md.
#   ASISTENT_NTFY: pingy udalosti (asistent_*) na subscribe-service. Zapnut az
#     ked subscribe-service pozna nove udalosti a nechava bodky v parametri t.
#   ASISTENT_MAZANIE: automaticke zmazanie bezplatneho uctu bez jedineho
#     rozhovoru za 12 mesiacov (denny cron). Zapnut az ked to budu slubovat zasady sukromia.
ASISTENT_EMAILY = "vypnute"
ASISTENT_NTFY = "vypnute"
ASISTENT_MAZANIE = "vypnute"
# Globálny denný strop automatických e-mailov (UTC deň). Nad ním nejde nič a
# príde jeden ping „Asistent: denný strop e-mailov dosiahnutý (nie platba)“.
ASISTENT_DENNY_STROP = "30"

# Workers AI: @cf/baai/bge-m3 (embeddings) and the chat model.
[ai]
binding = "AI"

# Vectorize: product embeddings, one index shared across tenants, filtered
# by a "tenant" metadata field on every vector (see src/embed.js).
# Create with:
#   wrangler vectorize create asistent-products --dimensions=1024 --metric=cosine
# Then create the metadata index the "tenant" filter in src/chat.js needs
# (without it, a filtered query silently matches nothing instead of
# erroring; retrieveCandidates() degrades to a slower unfiltered fallback
# rather than failing, but this should still be created before real
# traffic):
#   wrangler vectorize create-metadata-index asistent-products --property-name=tenant --type=string
[[vectorize]]
binding = "VECTORIZE"
index_name = "asistent-products"

# D1: tenants + daily counters, see schema.sql. Create with:
#   wrangler d1 create asistent
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "asistent"
database_id = "5db06a2c-7053-46a4-a70f-c35b03f1dc79"

# KV: short-lived per-IP rate-limit counters only (see src/security.js).
# Create with:
#   wrangler kv namespace create ASISTENT_CACHE
[[kv_namespaces]]
binding = "ASISTENT_CACHE"
id = "848dd3f27004468c9003db53bbc48b94"

# Uploaded files of the paid SEPA file check, POST /v1/kontrola/upload
# (see src/upload.js), one prefix per Stripe Checkout Session:
# kontrola/{session_id}/{ISO}.xml plus a .meta.json next to it.
# Nahrane subory platenej kontroly. KV, nie R2: R2 nie je na ucte zapnute a
# KV ma vstavane mazanie po lehote (expirationTtl v upload.js), takze sa
# 30-dnova retencia nespolieha na pravidlo, ktore by niekto musel vytvorit.
# Namespace vytvorit: npx wrangler kv namespace create KONTROLA
[[kv_namespaces]]
binding = "KONTROLA"
id = "230a9baa3bd1444a99788fa0024106d6"

# Daily feed refresh, 03:00 UTC (plus daily lifecycle upkeep), and the
# 10-minute lifecycle catch-up ("dobeh", src/zivotny-cyklus.js): unsent
# e-mails, delayed E0 and WordPress E1, E2, the 72-hour E3, "aktivny".
# src/cron.js tells them apart by event.cron.
[triggers]
crons = ["0 3 * * *", "*/10 * * * *"]

# Secret (not a [vars] entry, never committed): required by
# POST /v1/tenants/:id/reingest and PATCH/POST /v1/tenants/:id/plan
# (src/onboarding.js), compared against the request's X-Admin-Token header.
# The same value is set as ASISTENT_ADMIN_TOKEN in products/licence-service,
# which calls the /plan route after a Stripe payment (see that project's
# README "ARLing Asistent billing"). Set with:
#   wrangler secret put ADMIN_TOKEN

# Secret (not a [vars] entry, never committed): the Stripe restricted/secret
# key used by src/upload.js to read one Checkout Session and confirm it was
# paid before accepting a file. Read access to Checkout Sessions is enough.
# Without it every upload is refused with 503 (fail closed). Set with:
#   wrangler secret put STRIPE_SECRET_KEY
# Same key is reused by src/ucet.js for the Stripe purchase lookups (A.2
# backfill, A.4 nakup-session).

# Secret (not a [vars] entry, never committed): HMAC-SHA256 key (base64,
# e.g. `openssl rand -base64 32`) that signs the /v1/ucet/* Bearer token
# (src/ucet.js). Without it every /v1/ucet/* route, including the admin
# PUT /v1/ucet/nakup, answers 503 {error:'ucet_unavailable'} - the account
# system stays off rather than issue tokens nobody can invalidate. Set with:
#   wrangler secret put UCET_TAJOMSTVO

# Secret (not a [vars] entry, never committed): ciarkou oddeleny zoznam
# adries, ktorymi skusa majitel v testovacom rezime Stripe, napriklad
# "andrej@arling.sk". Testovacia Checkout Session (livemode false) otvori
# tovar LEN vtedy, ked ju zaplatila adresa z tohto zoznamu; bez tohto
# tajomstva neotvori nic. Zaroven to je jedina cesta, ako v teste prejst celu
# kontrolu SEPA suboru za 149 EUR bez penazi (src/upload.js,
# testSessionPovolena; nalezy N1 a B2 v ops/stripe/audit-po-platbe-2026-09-21.md
# a report ops/bezpecnost/arling-asistent-worker.md). POZOR: nastavit PRED
# nasadenim, inak prestanu majitelove skusky odomykat tovar. Set with:
#   wrangler secret put TEST_EMAILS

# Secret (not a [vars] entry, never committed, VOLITELNE): tajomstvo, ktore
# pri udalostiach quota_80, quota_100 a kontrola_upload pyta homelab
# (products/subscribe-service/app.py, ping_token_ok) v hlavicke X-Ping-Token.
# Musi sa zhodovat s PING_TOKEN tej sluzby. Kym tam nastaveny nie je, nechaj
# nenastaveny aj tu; ping potom ide ako doteraz bez hlavicky. Set with:
#   wrangler secret put PING_TOKEN

# Secret (not a [vars] entry, never committed): Resend API key used by
# src/ucet.js (posliKodEmailom) to send the 6-digit login code. Without it
# POST /v1/ucet/kod answers 503 {error:'mail_unavailable'} and discards the
# code - no account can be silently half-created. Resend's free tier
# (3 000 e-mails/month) is enough for this. arling.sk needs SPF/DKIM DNS
# records before Resend will actually deliver (see ops/spec-ucet.md, časť C).
# Set with:
#   wrangler secret put RESEND_API_KEY
# Secret (not a [vars] entry, never committed): ASISTENT_ADMIN_ZAPIS, samostatne
# tajomstvo pre DELETE /v1/tenants/:id, POST /v1/admin/asistent/doplnit a
# /uvitaci-email (src/zivotny-cyklus.js strazZapisu). Nepozna ho licence-service
# ani CRM skript; bez neho su tieto tri cesty zatvorene (503). Set with:
#   wrangler secret put ASISTENT_ADMIN_ZAPIS
# Secret (VOLITELNE): ASISTENT_ADMIN_CITANIE, len na citanie
# GET /v1/admin/asistent/udalosti (ops/crm/asistent.mjs), aby CRM nemalo ADMIN_TOKEN.
#   wrangler secret put ASISTENT_ADMIN_CITANIE
#
# Ten isty kluc pouziva aj zivotny cyklus Asistenta (src/zivotny-cyklus.js,
# odosielatel asistent@mail.arling.sk). Bez neho sa ziaden e-mail zivotneho
# cyklu neposle a nic sa nezapise ako odoslane. Volitelne e-maily E2 az E4
# potrebuju aj UCET_TAJOMSTVO (podpis odkazu na zastavenie e-mailov).
